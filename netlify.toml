[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Netlify serves everything copied out of public/ with
# `cache-control: public,max-age=0,must-revalidate`, so the fonts, images and
# videos were revalidated on every single navigation. Astro's own /_astro/*
# output is content-hashed and already cached properly; these rules give the
# unhashed public/ assets the same treatment.
#
# Fonts are immutable: the filename encodes the family and subset, and a new
# subset would be a new file.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and videos are NOT marked immutable — their paths are stable across
# deploys, so replacing one in place has to be able to reach existing visitors.
# 30 days with stale-while-revalidate keeps repeat views instant while letting a
# swapped asset propagate in the background within a day of the next visit.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# The catch-all in public/_redirects proxies every non-file path to the Webflow
# site, so a path that does not yet exist here is answered by Webflow — and its
# response, redirects included, can be cached at Netlify's edge. That cached
# answer then keeps being served AFTER the real page ships. These pages must
# therefore always be revalidated rather than held at the edge.
[[headers]]
  for = "/webinar/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The hub itself, which the glob above does not cover. This path was proxied to
# Webflow until now, so an edge-cached answer from before could otherwise
# outlive the page.
[[headers]]
  for = "/webinar"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/events/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/events"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# /about-us was proxied to Webflow by the catch-all until this page shipped, so
# an edge-cached Webflow answer could otherwise outlive it. Same reasoning as
# the webinar and events entries above.
[[headers]]
  for = "/about-us"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/about-us/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/privacy-policy"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/privacy-policy/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# /plastic-testing (CubeTen) was proxied to Webflow until this page shipped.
[[headers]]
  for = "/plastic-testing"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/plastic-testing/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# /rubber-testing (CubeOne) was proxied to Webflow until this page shipped.
[[headers]]
  for = "/rubber-testing"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/rubber-testing/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Retired Webflow-only pages (301s in public/_redirects) and the old sitemap
# path: each was answered by the Webflow proxy until now, so its edge-cached
# answer must not outlive the redirect.

[[headers]]
  for = "/get-a-quote-thank-you"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/hero-lab"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cube-go-waitlist"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/labscubed-automated-tensile-testing-for-polymer-labs"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/astm-d790-iso-178-explained-everything-you-need-to-know-about-plastic-flexural-testing"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Agent discovery -------------------------------------------------------
# RFC 8288 Link headers on the homepage point agents at the machine-readable
# resources (RFC 9727 §3 for the api-catalog relation).
[[headers]]
  for = "/"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json", </developers>; rel="service-doc", </llms.txt>; rel="describedby"; type="text/markdown", </.well-known/ai-catalog.json>; rel="ai-catalog", </.well-known/agent-skills/index.json>; rel="agent-skills", </sitemap-index.xml>; rel="sitemap"'

# RFC 9727: the catalog is served as a linkset. The file has no extension, so
# the type must be set explicitly.
[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/ai-catalog.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/agent-skills/*/SKILL.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/openapi.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
